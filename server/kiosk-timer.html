<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kiosk-Notausgang</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #181b1d;
        color: #ffffff;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        -webkit-user-select: none;
        user-select: none;
      }
      p {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.7;
        text-align: center;
      }
      #time {
        font-size: 2.4rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        font-size: 0.95rem;
        padding: 10px 14px;
        border-radius: 8px;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      #extend {
        background: #ffcc33;
        color: #2b2004;
      }
      #return {
        background: #1f8a4c;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <p>Kiosk pausiert -- automatische Rückkehr in</p>
    <div id="time">--:--</div>
    <div class="row">
      <button id="extend" type="button">+5 Min.</button>
      <button id="return" type="button">Zurück in den Kiosk</button>
    </div>
    <script>
      // Absolute URL statt relativ: diese Seite wird per file:// geladen
      // (siehe server/serve.js#openKioskTimerWindow), nicht ueber den
      // lokalen Webserver -- eine relative Pfadangabe wuerde sich sonst
      // faelschlich gegen den file://-Ursprung aufloesen.
      const API_BASE = "http://localhost:8080";
      async function refresh() {
        try {
          const res = await fetch(API_BASE + "/api/kiosk/exit-status");
          const data = await res.json();
          if (!data.active) {
            document.getElementById("time").textContent = "läuft bereits wieder";
            return;
          }
          const s = Math.max(0, Math.round(data.remainingMs / 1000));
          const m = String(Math.floor(s / 60)).padStart(2, "0");
          const sec = String(s % 60).padStart(2, "0");
          document.getElementById("time").textContent = m + ":" + sec;
        } catch {
          document.getElementById("time").textContent = "--:--";
        }
      }
      document.getElementById("extend").addEventListener("click", async () => {
        await fetch(API_BASE + "/api/kiosk/exit-extend", { method: "POST" }).catch(() => {});
        refresh();
      });
      document.getElementById("return").addEventListener("click", async () => {
        document.getElementById("time").textContent = "startet neu …";
        await fetch(API_BASE + "/api/kiosk/exit-return", { method: "POST" }).catch(() => {});
      });
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
