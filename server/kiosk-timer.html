<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kiosk-Notausgang</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #181b1d;
        color: #ffffff;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      /*
       * Bewusst ein kleines, normales Fenster (siehe
       * server/serve.js#openKioskTimerWindow) statt Vollbild: der
       * darunterliegende echte Desktop (wf-panel-pi + pcmanfm --desktop,
       * siehe openRecoveryDesktop) soll sichtbar und bedienbar bleiben,
       * dieses Fenster deckt ihn sonst komplett zu (gemeldeter Bug -- "ich
       * lande immer noch nicht auf dem Desktop"). Die urspruenglich
       * gewuenschte feste Position oben rechts liess sich unter Wayland/
       * labwc ohnehin nicht erreichen (--window-position wird ignoriert),
       * dank des echten Desktops darunter laesst sich dieses Fenster bei
       * Bedarf aber jetzt ganz normal verschieben.
       */
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 14px;
        box-sizing: border-box;
      }
      p.hint {
        margin: 0 0 4px;
        font-size: 0.72rem;
        color: #b6bcc2;
        line-height: 1.4;
      }
      #time {
        font-size: 2rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        font-size: 0.82rem;
        padding: 9px 12px;
        border-radius: 8px;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      #extend {
        background: #ffcc33;
        color: #2b2004;
      }
      #return {
        background: #1f8a4c;
        color: #ffffff;
      }
      .launcher {
        border: 1px solid #3a3f44;
        background: #24282b;
        color: #ffffff;
      }
      .launcher:active {
        background: #2f3438;
      }
      .launcher-status {
        min-height: 1.1em;
        font-size: 0.72rem;
        color: #b6bcc2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="hint">Der echte Desktop läuft im Hintergrund -- Kiosk pausiert, automatische Rückkehr in</p>
      <div id="time">--:--</div>
      <div class="row">
        <button id="extend" type="button">+5 Min.</button>
        <button id="return" type="button">Zurück in den Kiosk</button>
      </div>
      <div class="row" style="margin-top: 6px">
        <button class="launcher" id="launch-terminal" type="button">Terminal öffnen</button>
        <button class="launcher" id="launch-filemanager" type="button">Dateimanager öffnen</button>
      </div>
      <div class="launcher-status" id="launcher-status"></div>
    </div>

    <script>
      // Absolute URL statt relativ: diese Seite wird per file:// geladen
      // (siehe server/serve.js#openKioskTimerWindow), nicht ueber den
      // lokalen Webserver -- eine relative Pfadangabe wuerde sich sonst
      // faelschlich gegen den file://-Ursprung aufloesen.
      const API_BASE = "http://localhost:8080";
      // Token aus der URL (?token=...), von server/serve.js beim Oeffnen
      // dieses Fensters vergeben -- schuetzt die Terminal-/Dateimanager-
      // Endpunkte davor, dass irgendein anderes Geraet im selben WLAN sie
      // ohne Admin-Anmeldung aufrufen koennte (diese Seite selbst hat keine
      // eigene Admin-Sitzung, siehe requireAdmin in serve.js).
      const TOKEN = new URLSearchParams(location.search).get("token") || "";

      async function refresh() {
        try {
          const res = await fetch(API_BASE + "/api/kiosk/exit-status");
          const data = await res.json();
          if (!data.active) {
            document.getElementById("time").textContent = "läuft bereits wieder";
            return;
          }
          const s = Math.max(0, Math.round(data.remainingMs / 1000));
          const m = String(Math.floor(s / 60)).padStart(2, "0");
          const sec = String(s % 60).padStart(2, "0");
          document.getElementById("time").textContent = m + ":" + sec;
        } catch {
          document.getElementById("time").textContent = "--:--";
        }
      }
      document.getElementById("extend").addEventListener("click", async () => {
        await fetch(API_BASE + "/api/kiosk/exit-extend", { method: "POST" }).catch(() => {});
        refresh();
      });
      document.getElementById("return").addEventListener("click", async () => {
        document.getElementById("time").textContent = "startet neu …";
        await fetch(API_BASE + "/api/kiosk/exit-return", { method: "POST" }).catch(() => {});
      });
      refresh();
      setInterval(refresh, 1000);

      function launch(id, path) {
        const btn = document.getElementById(id);
        const status = document.getElementById("launcher-status");
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          status.textContent = "Wird geöffnet …";
          try {
            const res = await fetch(API_BASE + path, {
              method: "POST",
              headers: { "X-Kiosk-Exit-Token": TOKEN },
            });
            const data = await res.json().catch(() => ({}));
            status.textContent = data.ok ? "" : "Fehlgeschlagen (Notausgang evtl. inzwischen beendet?).";
          } catch {
            status.textContent = "Fehlgeschlagen -- Server nicht erreichbar.";
          } finally {
            btn.disabled = false;
          }
        });
      }
      launch("launch-terminal", "/api/kiosk/launch-terminal");
      launch("launch-filemanager", "/api/kiosk/launch-filemanager");
    </script>
  </body>
</html>
